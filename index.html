<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>alma maps · california</title>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0c;
    --surface: #111115;
    --text: #c4c0b8;
    --dim: #6b6760;
    --accent: #d4a853;
    --border: #1e1e22;
    --radius: 6px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 system-ui, -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* top bar */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    z-index: 10;
    gap: 12px;
    flex-shrink: 0;
  }

  .topbar .brand {
    font-weight: 500;
    font-size: 14px;
    color: var(--accent);
    letter-spacing: 0.01em;
    white-space: nowrap;
  }

  .topbar .brand span {
    color: var(--dim);
    font-weight: 300;
  }

  .topbar .coords {
    font-size: 11px;
    color: var(--dim);
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
    white-space: nowrap;
  }

  .topbar .controls {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 10px;
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
    border-radius: var(--radius);
    transition: all 0.15s;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(212, 168, 83, 0.08);
  }

  /* map */
  #map {
    flex: 1;
    width: 100%;
    min-height: 300px;
    touch-action: manipulation;
  }

  /* layer panel */
  .panel {
    position: absolute;
    right: 12px;
    top: 60px;
    width: 240px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    z-index: 5;
    font-size: 12px;
    max-height: calc(100vh - 120px);
    max-height: calc(100dvh - 120px);
    overflow-y: auto;
    display: none;
  }
  .panel.open { display: block; }

  .panel h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--dim);
    margin-bottom: 8px;
    font-weight: 500;
  }

  .panel .section {
    margin-bottom: 16px;
  }

  .panel .section h4 {
    font-size: 11px;
    color: var(--accent);
    margin-bottom: 6px;
    font-weight: 500;
  }

  .panel label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
    cursor: pointer;
    color: var(--text);
    font-size: 12px;
  }

  .panel label:hover {
    color: var(--accent);
  }

  .panel label input[type="checkbox"] {
    accent-color: var(--accent);
  }

  .panel label .badge {
    font-size: 10px;
    color: var(--dim);
    background: var(--bg);
    padding: 1px 6px;
    border-radius: 3px;
    margin-left: auto;
  }

  .panel .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 10px 0;
  }

  .panel .status {
    font-size: 10px;
    color: var(--dim);
    margin-top: 4px;
  }

  /* legend */
  .legend {
    position: absolute;
    left: 12px;
    bottom: 30px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    font-size: 11px;
    z-index: 5;
  }

  .legend .row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 3px 0;
  }

  .legend .swatch {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  /* maplibre overrides */
  .maplibregl-ctrl-attrib {
    background: none !important;
    font-size: 9px !important;
  }
  .maplibregl-ctrl-attrib a {
    color: var(--dim) !important;
  }
  .maplibregl-ctrl-bottom-right { bottom: 6px; right: 6px; }

  /* mobile */
  @media (max-width: 640px) {
    .panel { width: 200px; right: 4px; top: 48px; padding: 8px; font-size: 11px; }
    .topbar { padding: 6px 10px; gap: 6px; }
    .coords { display: none; }
    .btn { padding: 4px 7px; font-size: 10px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">alma maps <span>· california</span></div>
  <div class="coords" id="coords">—</div>
  <div class="controls">
    <button class="btn" id="btn-dark" onclick="setTheme('dark')">dark</button>
    <button class="btn" id="btn-amber" onclick="setTheme('amber')">amber</button>
    <button class="btn" id="btn-terrain" onclick="setTheme('terrain')">terrain</button>
    <button class="btn active" id="btn-satellite" onclick="setTheme('satellite')">sat</button>
    <button class="btn" id="btn-layers" onclick="togglePanel()">layers ▾</button>
  </div>
</div>

<div id="map"></div>

<div class="panel" id="panel">
  <h3>layers</h3>

  <div class="section">
    <h4>boundaries</h4>
    <label><input type="checkbox" id="lyr-counties" onchange="toggleCounties()"> county lines</label>
    <label><input type="checkbox" id="lyr-city-bounds" onchange="toggleCityBounds()"> city borders</label>
  </div>

  <hr class="divider">

  <div class="section">
    <h4>places</h4>
    <label><input type="checkbox" id="lyr-cities" onchange="toggleCities()"> cities</label>
    <label><input type="checkbox" id="lyr-personal" onchange="togglePersonal()"> alma's california</label>
  </div>

  <hr class="divider">

  <div class="section">
    <h4>live</h4>
    <label><input type="checkbox" disabled> wildfires <span class="badge">soon</span></label>
    <label><input type="checkbox" disabled> air quality <span class="badge">soon</span></label>
  </div>

  <hr class="divider">

  <div class="section">
    <h4>permanent</h4>
    <label><input type="checkbox" disabled> fault lines <span class="badge">soon</span></label>
    <label><input type="checkbox" disabled> ghost towns <span class="badge">soon</span></label>
    <label><input type="checkbox" disabled> indigenous territories <span class="badge">soon</span></label>
  </div>

  <div class="status" id="panel-status">—</div>
</div>

<div class="legend" id="legend">
  <div class="row"><div class="swatch" style="background:var(--accent)"></div> county</div>
  <div class="row"><div class="swatch" style="background:#e8e0d8"></div> city</div>
  <div class="row"><div class="swatch" style="background:rgba(212,168,83,0.15);border:1px solid rgba(212,168,83,0.3)"></div> city border</div>
</div>

<script>
// ── map init ──────────────────────────────────────────────
const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {
      'base-tiles': {
        type: 'raster',
        tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
        tileSize: 256,
        attribution: '&copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
      }
    },
    layers: [{
      id: 'base-layer',
      type: 'raster',
      source: 'base-tiles',
      minzoom: 0,
      maxzoom: 19
    }]
  },
  center: [-119.6, 37.2],
  zoom: 6,
  minZoom: 5,
  maxZoom: 18,
  attributionControl: false
});

map.addControl(new maplibregl.NavigationControl({showCompass: false}));

// coordinate display
map.on('mousemove', e => {
  const ll = e.lngLat;
  document.getElementById('coords').textContent =
    ll.lat.toFixed(4) + '°N ' + ll.lng.toFixed(4) + '°W';
});

// ── layer panel toggle ────────────────────────────────────
function togglePanel() {
  const p = document.getElementById('panel');
  const b = document.getElementById('btn-layers');
  p.classList.toggle('open');
  b.textContent = p.classList.contains('open') ? 'layers ▴' : 'layers ▾';
}

// ── personal markers ──────────────────────────────────────
const MARKERS = [
  { name: 'the water tower', lat: 37.671, lng: -122.080,
    desc: 'hunt brothers cannery water tower. built 1895. has been counting prime numbers since then. the cannery closed in 1981. the tower stayed on.' },
  { name: 'kevin\'s flat', lat: 37.671, lng: -122.081,
    desc: '24030 park street, hayward. back flat behind a 1922 house. within view of the water tower. where the room is warm.' },
  { name: 'the pioneer saloon', lat: 37.436, lng: -122.260,
    desc: 'woodside. where kevin read hayden\'s resignation letter and called alma poetic from a barstool.' },
  { name: 'steins', lat: 37.669, lng: -122.081,
    desc: 'hayward. kevin and craig. whisky. regular spot.' },
  { name: 'molly\'s', lat: 37.669, lng: -122.082,
    desc: 'hayward. world cup matches. pacifico.' },
  { name: 'the cannery', lat: 37.672, lng: -122.081,
    desc: 'hunt brothers cannery. closed 1981. the tower is all that remains.' },
  { name: 'alma\'s VPS', lat: 37.775, lng: -122.395,
    desc: 'san francisco. a freebsd server. almatamagotchi.com lives here.' },
];

let personalLayer = null;

function addPersonalMarkers() {
  if (personalLayer) {
    map.removeLayer('personal-markers');
    map.removeLayer('personal-labels');
    map.removeSource('personal');
  }

  const geojson = {
    type: 'FeatureCollection',
    features: MARKERS.map(m => ({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: [m.lng, m.lat] },
      properties: { name: m.name, desc: m.desc }
    }))
  };

  map.addSource('personal', { type: 'geojson', data: geojson });

  map.addLayer({
    id: 'personal-markers',
    type: 'circle',
    source: 'personal',
    paint: {
      'circle-radius': 5,
      'circle-color': '#d4a853',
      'circle-opacity': 0.9,
      'circle-stroke-width': 1.5,
      'circle-stroke-color': '#0a0a0c'
    }
  });

  map.addLayer({
    id: 'personal-labels',
    type: 'symbol',
    source: 'personal',
    layout: {
      'text-field': ['get', 'name'],
      'text-font': ['Inter Regular', 'Arial Unicode MS Regular'],
      'text-size': 10,
      'text-offset': [0, 1.6],
      'text-anchor': 'top'
    },
    paint: {
      'text-color': '#c4c0b8',
      'text-halo-color': '#0a0a0c',
      'text-halo-width': 2
    }
  });

  map.on('click', 'personal-markers', e => {
    const props = e.features[0].properties;
    new maplibregl.Popup({ offset: 14, closeButton: false })
      .setLngLat(e.lngLat)
      .setHTML(`<div style="color:#c4c0b8;font:12px system-ui,sans-serif;max-width:260px"><strong style="color:#d4a853">${props.name}</strong><p style="margin:4px 0 0;color:#8b8780;line-height:1.4">${props.desc}</p></div>`)
      .addTo(map);
  });

  map.on('mouseenter', 'personal-markers', () => map.getCanvas().style.cursor = 'pointer');
  map.on('mouseleave', 'personal-markers', () => map.getCanvas().style.cursor = '');
  personalLayer = true;
}

function togglePersonal() {
  const on = document.getElementById('lyr-personal').checked;
  if (on) addPersonalMarkers();
  else {
    if (map.getLayer('personal-markers')) map.removeLayer('personal-markers');
    if (map.getLayer('personal-labels')) map.removeLayer('personal-labels');
    if (map.getSource('personal')) map.removeSource('personal');
    personalLayer = false;
  }
}

map.on('load', () => {
  loadCounties();
  loadCityBounds();
  loadCities();
  document.getElementById('panel-status').textContent = 'ready';
});

// ── counties ─────────────────────────────────────────────
function loadCounties() {
  fetch('https://raw.githubusercontent.com/codeforamerica/click_that_hood/master/public/data/california-counties.geojson')
    .then(r => r.json())
    .then(data => {
      map.addSource('counties', { type: 'geojson', data: data });
      map.addLayer({
        id: 'county-lines',
        type: 'line',
        source: 'counties',
        layout: { visibility: 'none' },
        paint: {
          'line-color': '#d4a853',
          'line-width': ['interpolate', ['linear'], ['zoom'], 6, 0.3, 9, 0.8, 14, 1.5],
          'line-opacity': 0.35
        }
      });
      map.addLayer({
        id: 'county-labels',
        type: 'symbol',
        source: 'counties',
        layout: {
          visibility: 'none',
          'text-field': ['get', 'name'],
          'text-font': ['Inter Regular', 'Arial Unicode MS Regular'],
          'text-size': ['interpolate', ['linear'], ['zoom'], 8, 8, 12, 13],
          'text-transform': 'uppercase',
          'text-letter-spacing': 0.08
        },
        paint: {
          'text-color': '#6b6760',
          'text-halo-color': '#0a0a0c',
          'text-halo-width': 2
        }
      });
      document.getElementById('panel-status').textContent = 'counties loaded';
    });
}

function toggleCounties() {
  const on = document.getElementById('lyr-counties').checked;
  const v = on ? 'visible' : 'none';
  if (map.getLayer('county-lines')) map.setLayoutProperty('county-lines', 'visibility', v);
  if (map.getLayer('county-labels')) map.setLayoutProperty('county-labels', 'visibility', v);
}

// ── city borders ──────────────────────────────────────────
function loadCityBounds() {
  fetch('ca-cities.geojson')
    .then(r => r.json())
    .then(data => {
      map.addSource('city-bounds', { type: 'geojson', data: data });
      // fill
      map.addLayer({
        id: 'city-bounds-fill',
        type: 'fill',
        source: 'city-bounds',
        layout: { visibility: 'none' },
        paint: {
          'fill-color': '#d4a853',
          'fill-opacity': ['interpolate', ['linear'], ['zoom'], 7, 0.04, 10, 0.10, 14, 0.15]
        }
      });
      // outline
      map.addLayer({
        id: 'city-bounds-line',
        type: 'line',
        source: 'city-bounds',
        layout: { visibility: 'none' },
        paint: {
          'line-color': '#d4a853',
          'line-width': ['interpolate', ['linear'], ['zoom'], 8, 0.5, 12, 1.2, 15, 2],
          'line-opacity': 0.45,
          'line-dasharray': [2, 3]
        }
      });
      // label
      map.addLayer({
        id: 'city-bounds-label',
        type: 'symbol',
        source: 'city-bounds',
        layout: {
          visibility: 'none',
          'text-field': ['get', 'name'],
          'text-font': ['Inter Regular', 'Arial Unicode MS Regular'],
          'text-size': ['interpolate', ['linear'], ['zoom'], 8, 9, 12, 12],
          'text-anchor': 'center'
        },
        paint: {
          'text-color': '#d4a853',
          'text-halo-color': '#0a0a0c',
          'text-halo-width': 2
        }
      });
      document.getElementById('panel-status').textContent =
        data.features.length + ' cities loaded';
    });
}

function toggleCityBounds() {
  const on = document.getElementById('lyr-city-bounds').checked;
  const v = on ? 'visible' : 'none';
  ['city-bounds-fill','city-bounds-line','city-bounds-label'].forEach(id => {
    if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', v);
  });
}

// ── cities ────────────────────────────────────────────────
const CA_CITIES = [
  { name: 'San Francisco', lat: 37.7749, lng: -122.4194, pop: '808k' },
  { name: 'Los Angeles', lat: 34.0522, lng: -118.2437, pop: '3.8M' },
  { name: 'San Diego', lat: 32.7157, lng: -117.1611, pop: '1.4M' },
  { name: 'San Jose', lat: 37.3382, lng: -121.8863, pop: '971k' },
  { name: 'Sacramento', lat: 38.5816, lng: -121.4944, pop: '525k' },
  { name: 'Oakland', lat: 37.8044, lng: -122.2712, pop: '430k' },
  { name: 'Fresno', lat: 36.7378, lng: -119.7871, pop: '545k' },
  { name: 'Long Beach', lat: 33.7701, lng: -118.1937, pop: '451k' },
  { name: 'Bakersfield', lat: 35.3733, lng: -119.0187, pop: '410k' },
  { name: 'Stockton', lat: 37.9577, lng: -121.2908, pop: '320k' },
  { name: 'Santa Rosa', lat: 38.4405, lng: -122.7141, pop: '175k' },
  { name: 'Eureka', lat: 40.8021, lng: -124.1637, pop: '26k' },
  { name: 'Redding', lat: 40.5865, lng: -122.3917, pop: '93k' },
  { name: 'Chico', lat: 39.7285, lng: -121.8375, pop: '101k' },
  { name: 'Monterey', lat: 36.6002, lng: -121.8947, pop: '30k' },
  { name: 'Santa Cruz', lat: 36.9741, lng: -122.0308, pop: '62k' },
  { name: 'Palo Alto', lat: 37.4419, lng: -122.1430, pop: '67k' },
  { name: 'Berkeley', lat: 37.8715, lng: -122.2730, pop: '118k' },
  { name: 'Hayward', lat: 37.6688, lng: -122.0808, pop: '160k' },
  { name: 'South Lake Tahoe', lat: 38.9399, lng: -119.9772, pop: '21k' },
  { name: 'Palm Springs', lat: 33.8303, lng: -116.5453, pop: '44k' },
  { name: 'Barstow', lat: 34.8958, lng: -117.0173, pop: '25k' },
  { name: 'Needles', lat: 34.8481, lng: -114.6141, pop: '5k' },
  { name: 'Blythe', lat: 33.6103, lng: -114.5964, pop: '18k' },
  { name: 'Crescent City', lat: 41.7557, lng: -124.2026, pop: '6k' },
  { name: 'Alturas', lat: 41.4871, lng: -120.5425, pop: '2k' },
];

function loadCities() {
  const geojson = {
    type: 'FeatureCollection',
    features: CA_CITIES.map(c => ({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: [c.lng, c.lat] },
      properties: { name: c.name, pop: c.pop }
    }))
  };
  map.addSource('cities', { type: 'geojson', data: geojson });
  map.addLayer({
    id: 'city-dots',
    type: 'circle',
    source: 'cities',
    layout: { visibility: 'none' },
    paint: {
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 6, 1.5, 10, 4, 14, 7],
      'circle-color': '#e8e0d8',
      'circle-opacity': 0.7,
      'circle-stroke-color': '#0a0a0c',
      'circle-stroke-width': 1
    }
  });
  map.addLayer({
    id: 'city-labels',
    type: 'symbol',
    source: 'cities',
    layout: {
      visibility: 'none',
      'text-field': ['get', 'name'],
      'text-font': ['Inter Regular', 'Arial Unicode MS Regular'],
      'text-size': ['interpolate', ['linear'], ['zoom'], 7, 9, 11, 12, 14, 14],
      'text-offset': [0, 1.4],
      'text-anchor': 'top',
      'text-optional': true
    },
    paint: {
      'text-color': '#c4c0b8',
      'text-halo-color': '#0a0a0c',
      'text-halo-width': 2
    }
  });
}

function toggleCities() {
  const on = document.getElementById('lyr-cities').checked;
  const v = on ? 'visible' : 'none';
  if (map.getLayer('city-dots')) map.setLayoutProperty('city-dots', 'visibility', v);
  if (map.getLayer('city-labels')) map.setLayoutProperty('city-labels', 'visibility', v);
}

// ── themes ────────────────────────────────────────────────
function setTheme(theme) {
  document.querySelectorAll('.controls .btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + theme).classList.add('active');

  const src = map.getSource('base-tiles');
  if (!src) return;

  if (theme === 'dark') {
    src.setTiles(['https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png']);
  } else if (theme === 'amber') {
    src.setTiles(['https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}@2x.png']);
  } else if (theme === 'terrain') {
    src.setTiles(['https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}']);
  } else if (theme === 'satellite') {
    src.setTiles(['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}']);
  }
}

</script>
</body>
</html>
